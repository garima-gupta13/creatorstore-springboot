server:
  port: 8081
spring:
  application:
    name: CreatorStore

#Database information
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}


#ORM Configuration
#Hibernate ORM configuration

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
        hibernate:
          format_sql: true